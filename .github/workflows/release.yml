name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ESPHOME_VERSION: "2025.7.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ESPHome
        run: python -m pip install "esphome==${ESPHOME_VERSION}" pyyaml
      - name: Host tests
        run: make -C host_tests test
      - name: Validate YAML and docs links
        run: python tools/validate_repo.py
      - name: Build web release
        run: >-
          python tools/build_web_release.py
          --compile
          --compile-yaml-profiles
          --local-source
          --version "${GITHUB_REF_NAME}"
      - name: Generate checksums
        run: |
          cd dist/web-release/web
          for file in firmware/*.bin manifest-*.json; do
            sha256sum "$file" | sed 's#  firmware/#  #'
          done > ../SHA256SUMS
      - name: Render release notes
        run: >-
          python tools/render_release_notes.py
          "${GITHUB_REF_NAME}"
          --output dist/web-release/RELEASE_NOTES.md
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/web-release/RELEASE_NOTES.md
          files: |
            dist/web-release/web/firmware/*.bin
            dist/web-release/web/manifest-*.json
            dist/web-release/SHA256SUMS
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web-release/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
