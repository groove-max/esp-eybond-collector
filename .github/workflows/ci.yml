name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ESPHOME_VERSION: "2025.7.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ESPHome
        run: python -m pip install "esphome==${ESPHOME_VERSION}" pyyaml
      - name: Host tests
        run: make -C host_tests test
      - name: Validate YAML and docs links
        run: python tools/validate_repo.py
      - name: Compile release presets and YAML-only profiles
        run: >-
          python tools/build_web_release.py
          --compile
          --compile-yaml-profiles
          --local-source
          --version ci
