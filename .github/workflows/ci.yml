name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ESPHOME_VERSION: "2025.7.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ESPHome
        run: python -m pip install "esphome==${ESPHOME_VERSION}" pyyaml
      - name: Host tests
        run: make -C host_tests test
      - name: Platform IO contracts
        run: python host_tests/platform_contract_check.py
      - name: Code generation contracts
        run: python host_tests/test_codegen.py
      - name: Validate YAML and docs links
        run: python tools/validate_repo.py
      - name: Compile release presets and YAML-only profiles
        run: >-
          python tools/build_web_release.py
          --compile
          --compile-yaml-profiles
          --local-source
          --version ci
      - name: Keep ready-to-flash boards for testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: collector-installer-preview
          path: dist/web-release/web/
          if-no-files-found: error
          retention-days: 14

  current-esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [esp32-c3, esp32-devkit, esp32-ble]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install current ESPHome
        run: python -m pip install "esphome==2026.10.2" pyyaml
      - name: Code generation contracts
        run: python host_tests/test_codegen.py
      - name: Compile with native ESP-IDF toolchain
        run: python tools/check_esphome_compat.py --profile "${{ matrix.profile }}"
