# 4 MB SuperMini with an active-low LED; TTL or external RS232 transceiver.
# This file is also the ESPHome dashboard import package; keep it deployable
# without private secrets. For older GPIO4/5/6 wiring use your original YAML.
substitutions:
  name: eybond-bridge
  friendly_name: EyeBond Collector

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: groove-max.eybond-collector
    version: "0.1.12"

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: arduino

logger:
  # C3 defaults to native USB: USB_CDC (2025 Arduino), USB_SERIAL_JTAG (2026).
  # Keep GPIO20/21 exclusively for the inverter UART.
  level: DEBUG

wifi:
  ap: {}

captive_portal:

ota:
  - platform: esphome

api:
  reboot_timeout: 0s

dashboard_import:
  package_import_url: github://groove-max/esp-eybond-collector/examples/esp32-c3.yaml@main
  import_full_config: false

external_components:
  - source: github://groove-max/esp-eybond-collector
    components: [eybond_collector]

uart:
  id: inverter_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

eybond_collector:
  id: bridge
  uart_id: inverter_uart
  web_configuration: true
  status_led_pin:
    number: GPIO8
    inverted: true

select:
  - platform: eybond_collector
    eybond_collector_id: bridge
    name: Inverter UART baud rate
    restore_value: true
