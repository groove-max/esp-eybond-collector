# ESP32-C3 YAML-only profile (not the ESP32 DevKit browser image).
# Compile-tested; physical UART/radio operation still needs board validation.
# Check the schematic of your particular board before wiring these example pins.
# GPIO4/5: UART TX/RX; GPIO6: optional RS485 DE+RE. No status LED assumed.

esphome:
  name: eybond-bridge-c3

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

ota:
  - platform: esphome

external_components:
  - source: github://groove-max/esp-eybond-collector
    components: [eybond_collector]

uart:
  id: inverter_uart
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

eybond_collector:
  id: bridge
  uart_id: inverter_uart
  web_configuration: true
  flow_control_pin: GPIO6  # RS485 DE+RE; leave unconnected for TTL/RS232

select:
  - platform: eybond_collector
    eybond_collector_id: bridge
    name: "Inverter UART baud rate"
    restore_value: true

api:
  reboot_timeout: 0s
